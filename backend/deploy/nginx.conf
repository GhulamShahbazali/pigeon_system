# PigeonFly — Nginx reverse proxy (on the Droplet, in front of the api service).
# TLS is terminated at the DigitalOcean Load Balancer ahead of this (with sticky
# sessions for Socket.io); this block speaks plain HTTP to the api upstream.

# Flood protection before requests reach Node (app-level throttler is the 2nd layer).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream pigeon_api {
    server api:3000;      # docker-compose service name
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;         # chat/video uploads go via R2 presign, but allow headroom

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1000;

    # Health probes: no rate limit, cheap.
    location /v1/health { proxy_pass http://pigeon_api; }

    location / {
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://pigeon_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (Socket.io)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
